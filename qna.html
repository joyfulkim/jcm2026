<script>
const qnaItems = [
  {
    id: 'free-registration',
    status: '답변완료',
    date: '2026-06-10',
    title: '등록은 무료로 참여할 수 있나요?',
    body: '네. 지저스 미션 컨퍼런스 2026은 등록비 무료로 참여하실 수 있습니다. 다만 원활한 현장 접수와 좌석 준비를 위해 사전 등록을 권장드립니다.'
  },
  {
    id: 'accommodation-cost',
    status: '답변완료',
    date: '2026-06-09',
    title: '숙소 신청과 비용은 어떻게 안내되나요?',
    body: '숙소는 별도 신청 및 비용 부담으로 안내됩니다. 신청 가능 객실, 이용 기간, 비용, 입실 안내는 확정되는 대로 공지사항과 숙소신청 안내 영역을 통해 순차적으로 안내드리겠습니다.'
  },
  {
    id: 'group-registration',
    status: '접수중',
    date: '2026-06-08',
    title: '단체 등록 문의는 어디로 하면 되나요?',
    body: '단체 등록은 운영팀 문의 채널을 통해 남겨주시면 확인 후 안내드리겠습니다. 교회명, 담당자 성함, 연락처, 예상 참석 인원을 함께 남겨주시면 더 빠르게 도와드릴 수 있습니다.'
  },
  {
    id: 'parking-shuttle',
    status: '접수중',
    date: '2026-06-07',
    title: '현장 주차와 셔틀 안내가 있나요?',
    body: '현장 주차 및 셔틀 운영 여부는 행사장 동선이 확정된 뒤 안내됩니다. 오시는 길 페이지와 공지사항을 통해 최신 안내를 확인해 주세요.'
  }
];

function esc(value) {
  return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderQna() {
  const params = new URLSearchParams(window.location.search);
  const activeId = params.get('id');
  const board = document.getElementById('qna-board');

  if (!activeId) {
    board.innerHTML = `
      <div class="board-card editorial-shadow overflow-hidden border border-outline-variant/50 bg-surface-container-lowest">
        <div class="hidden grid-cols-[140px_1fr_150px] border-b border-outline-variant/60 bg-surface-container-low px-6 py-4 text-sm font-black text-on-surface-variant md:grid">
          <span>상태</span>
          <span>제목</span>
          <span class="text-right">작성일</span>
        </div>
        <div>
          ${qnaItems.map((item) => `
            <a href="qna.html?id=${encodeURIComponent(item.id)}" class="grid gap-2 border-b border-outline-variant/45 px-5 py-5 transition last:border-b-0 hover:bg-secondary-fixed/45 md:grid-cols-[140px_1fr_150px] md:items-center md:px-6">
              <span class="w-fit rounded-full ${item.status === '답변완료' ? 'bg-primary-fixed text-on-primary-fixed-variant' : 'bg-surface-container-high text-on-surface-variant'} px-3 py-1 text-xs font-extrabold">${esc(item.status)}</span>
              <span class="min-w-0 text-base font-extrabold text-on-surface md:truncate">${esc(item.title)}</span>
              <time class="text-sm font-bold text-on-surface-variant md:text-right">${esc(item.date)}</time>
            </a>
          `).join('')}
        </div>
      </div>
    `;
    return;
  }

  const activeItem = qnaItems.find((item) => item.id === activeId);
  if (!activeItem) {
    board.innerHTML = `
      <div class="board-card editorial-shadow border border-dashed border-outline-variant/70 bg-surface-container-lowest p-10 text-center">
        <p class="text-sm font-bold text-on-surface-variant">요청하신 문의/답변을 찾을 수 없습니다.</p>
        <a href="qna.html" class="mt-6 inline-flex rounded-xl bg-secondary px-5 py-3 text-sm font-extrabold text-white hover:bg-secondary/90">목록으로</a>
      </div>
    `;
    return;
  }

  board.innerHTML = `
    <article class="board-card editorial-shadow border border-outline-variant/50 bg-surface-container-lowest p-6 md:p-8">
      <div class="mb-5 flex flex-wrap items-center gap-3">
        <span class="rounded-full ${activeItem.status === '답변완료' ? 'bg-primary-fixed text-on-primary-fixed-variant' : 'bg-surface-container-high text-on-surface-variant'} px-3 py-1 text-xs font-extrabold">${esc(activeItem.status)}</span>
        <time class="ml-auto text-sm font-bold text-on-surface-variant">${esc(activeItem.date)}</time>
      </div>
      <h1 class="text-2xl font-black leading-tight text-on-surface md:text-4xl">${esc(activeItem.title)}</h1>
      <div class="mt-8 whitespace-pre-line text-base leading-8 text-on-surface-variant">${esc(activeItem.body)}</div>
      <div class="mt-10 flex flex-wrap gap-3 border-t border-outline-variant/60 pt-6">
        <a href="qna.html" class="inline-flex items-center gap-2 rounded-xl bg-secondary px-5 py-3 text-sm font-extrabold text-white hover:bg-secondary/90">
          <span class="material-symbols-outlined text-base">list</span>
          목록으로
        </a>
        <a href="#jmc-chat-button" class="inline-flex items-center gap-2 rounded-xl bg-surface-container-high px-5 py-3 text-sm font-extrabold text-on-surface-variant hover:bg-secondary-fixed">
          추가 문의하기
          <span class="material-symbols-outlined text-base">chat</span>
        </a>
      </div>
    </article>
  `;
}

document.addEventListener('DOMContentLoaded', renderQna);
</script>
